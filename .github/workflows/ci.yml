# this file runs the checks on github actions (nothing is deployed to a server yet)
# every pull request and every push to main: build the frontend, then build the backend image, test it and smoke test it
# every push to main also publishes the backend image to the github container registry (ghcr)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # allow a manual run from the actions tab
  workflow_dispatch:

# give the jobs read-only access
permissions:
  contents: read

# cancel an old run on the same branch when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # install the exact versions from package-lock.json
      - run: npm ci
        working-directory: frontend

      # check that the production build works
      - run: npm run build
        working-directory: frontend

  backend:
    name: build and test backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # build the image and keep its layers in the github cache, so later runs are faster
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: querio-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # run the unit tests inside the image, so they use the same packages as production
      # they need no api keys, because they never call a model
      - name: run unit tests
        run: |
          docker run --rm \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            querio-backend:ci \
            sh -c "pip install -q --no-cache-dir -r requirements-dev.txt && python -m pytest tests -q -p no:cacheprovider"

      - name: smoke test the container
        run: |
          # start the container with a fake invite code and no api keys
          docker run -d --name querio -p 8000:8000 -e INVITE_CODE=ci-test-invite querio-backend:ci

          # wait up to 2 minutes for the server to answer
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8000/health

          # an api call without the invite code must be rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/sessions)" = "401"

          # the verify call with the invite code must pass
          curl -fs -H "X-Invite-Code: ci-test-invite" http://127.0.0.1:8000/api/auth/verify

      - name: show the container logs
        if: failure()
        run: docker logs querio

  publish:
    name: publish backend image
    # only after the frontend build and the backend tests pass
    needs: [frontend, backend]
    # only on a push to main, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # this job needs write access to the container registry
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # log in to ghcr with the built-in token, so no extra secret is needed
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # make the image name and tags (the name is turned into lowercase, which ghcr needs)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/querio-backend
          tags: |
            type=raw,value=latest
            type=sha

      # build again from the same cache and push the image
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
